controller_manager:
  ros__parameters:
    update_rate: 100
    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    parallel_gripper_controller:
      type: parallel_gripper_action_controller/GripperActionController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster


joint_trajectory_controller:
  ros__parameters:
    joints:
      - shoulder_pan
      - shoulder_lift
      - elbow_flex
      - wrist_flex
      - wrist_roll

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity
    action_monitor_rate: 20.0

    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.5
      shoulder_pan:
        goal: 0.02
      shoulder_lift:
        goal: 0.02
      elbow_flex:
        goal: 0.02
      wrist_flex:
        goal: 0.02
      wrist_roll:
        goal: 0.02

parallel_gripper_controller:
  ros__parameters:
    joint: gripper

    state_interfaces:
    - position
    - velocity
    - effort
    goal_tolerance: 0.1
    allow_stalling: True
    stall_velocity_threshold: 0.001
    stall_timeout: 0.5
